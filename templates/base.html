<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}QueueLess{% endblock %}</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
<div class="noise-layer" aria-hidden="true"></div>
<header class="site-nav">
  <a class="brand" href="{{ url_for('home') }}">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12c2-4 4-6 8-6s6 2 8 6-4 6-8 6-6-2-8-6Z" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="12" cy="12" r="2.1" fill="currentColor"/>
      </svg>
    </span>
    QueueLess
  </a>
  <nav class="nav-links">
    <a href="{{ url_for('home') }}#services">Services</a>
    <a href="{{ url_for('home') }}#how">How it works</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <span>QueueLess — your place in line, wherever you are.</span>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
